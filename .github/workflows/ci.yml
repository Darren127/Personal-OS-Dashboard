# Runs every check on each push and pull request: code checks, then the
# database, integration and browser tests against a throwaway local Supabase.
# No real secrets are needed: Supabase runs locally inside the job, and the
# AI Companion is tested against a mock API (tests/e2e/mock-anthropic.mjs).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: npm run db:start

      - name: Write .env.local from the local Supabase (test-only values)
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } > .env.local

      - name: Database tests (security rules, constraints, triggers)
        run: npm run db:test

      - name: Unit and integration tests
        run: npm test

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (builds the app first)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
