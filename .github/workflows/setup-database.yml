# Applies the database schema (supabase/migrations/) to your hosted Supabase
# project. Run it by hand: GitHub → Actions → "Set up database" → Run workflow.
# It only adds migrations that haven't been applied yet; it never resets or
# deletes data, so it is safe to run again after adding a new migration.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_REF   Project Settings → General → Project ID (20 lowercase letters)
#   SUPABASE_DB_PASSWORD   the database password chosen when creating the project
name: Set up database

on:
  workflow_dispatch:

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "$PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      # Accept the bare ref or anything containing it (a pasted project URL,
      # extra spaces): a ref is exactly 20 lowercase letters.
      - name: Read the project ref
        run: |
          ref=$(printf '%s' "$PROJECT_REF" | grep -oE '(^|[^a-z])[a-z]{20}([^a-z]|$)' | grep -oE '[a-z]{20}' | head -n1 || true)
          if [ -z "$ref" ]; then
            echo "::error::SUPABASE_PROJECT_REF must be your project's ID: exactly 20 lowercase letters. Find it in Supabase → Project Settings → General → Project ID."
            exit 1
          fi
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Show what will be applied
        run: supabase db push --dry-run

      - name: Apply new migrations
        run: supabase db push

      - name: Check the schema
        run: supabase db lint --linked --level warning
